[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsky-harness"
version = "0.1.0"
description = "Scientific validation, parity, and performance evaluation for torchsky"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["torchsky>=0.4.0"]

[project.scripts]
torchsky-harness = "torchsky_harness.cli:main"

[tool.setuptools]
packages = ["torchsky_harness", "torchsky_harness.benchmarks", "torchsky_harness.benchmarks.replays", "torchsky_harness.benchmarks.updc", "torchsky_harness.scripts"]
package-dir = { torchsky_harness = "src/torchsky_harness", "torchsky_harness.benchmarks" = "benchmarks", "torchsky_harness.benchmarks.replays" = "benchmarks/replays", "torchsky_harness.benchmarks.updc" = "benchmarks/updc", "torchsky_harness.scripts" = "scripts" }
include-package-data = true

[tool.setuptools.package-data]
torchsky_harness = ["fixtures/upstream_astropy_catalogs/*.xml", "fixtures/upstream_astropy_catalogs/*.md", "fixtures/*.fits", "schemas/*.json", "release_performance_claims.json"]
"torchsky_harness.benchmarks" = ["baselines/*.json", "baselines/*.md", "scorecards/*.json", "scorecards/*.md", "*.md"]
"torchsky_harness.benchmarks.replays" = ["*.json"]
"torchsky_harness.benchmarks.updc" = ["*.md"]
"torchsky_harness.scripts" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["performance: scaling or performance evaluations", "integration: cross-domain evaluations", "slow: expensive scientific evaluations", "benchmark: opt-in scale or throughput evaluations"]
filterwarnings = ["ignore::DeprecationWarning:torch.jit._script"]

[tool.ruff]
extend-exclude = ["build", "dist", "*.egg-info", ".local-artifacts"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[project.optional-dependencies]
bench = ["astropy>=5.0", "drizzle>=2.2.0", "dfreproject>=1.3.0", "pandas>=1.0", "matplotlib>=3.0", "seaborn>=0.11.0", "pytest-benchmark>=3.0", "pytest-xdist>=3.0", "psutil>=5.0", "reproject>=0.14", "pyarrow>=14.0", "polars>=1.0"]
bench-all = ["astropy>=5.0", "drizzle>=2.2.0", "dfreproject>=1.3.0", "pandas>=1.0", "matplotlib>=3.0", "seaborn>=0.11.0", "pytest-benchmark>=3.0", "pytest-xdist>=3.0", "psutil>=5.0", "reproject>=0.14", "pyarrow>=14.0", "polars>=1.0", "healpy>=1.19.0,<2", "hpgeom>=1.0", "healsparse>=1.10", "mocpy>=0.13", "astropy-healpix>=1.0", "spherical-geometry>=1.2"]
sht-bench = ["s2fft>=1.0"]
test = ["pytest>=6.0", "pytest-cov>=2.0", "pytest-benchmark>=3.0", "pytest-xdist>=3.0", "psutil>=5.0", "scipy>=1.9.0", "requests>=2.28.0", "polars>=1.0", "pyarrow>=14.0", "pandas>=2.2", "astropy>=5.0", "pyright>=1.1.350"]
