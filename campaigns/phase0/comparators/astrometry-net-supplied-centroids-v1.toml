schema_version = 1
id = "astrometry-net-supplied-centroids-v1"
adapter = "torchsky.wcs.solve_with_astrometry_net"
executable = "solve-field"
version = "0.97"
version_args = ["--version"]
environment = "phase0-astrometry-net"
input_format = "XYLS"
input_columns = ["X", "Y", "FLUX", "ROW_ID", "COV_XX", "COV_XY", "COV_YY"]
detection = false
native_index = false
runtime_index_downloads = false
executable_sha256_required = true
index_manifest_sha256_required = true
index_file_sha256_required = true
index_manifest_env = "ASTROMETRY_INDEX_MANIFEST"
bootstrap_output = ["wcs", "match", "corr", "solved"]
verification = "separate solve-field --verify invocation over held-out supplied rows"
refinement = "torchsky.wcs.astrometry bundle solver"
