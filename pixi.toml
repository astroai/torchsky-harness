# Environment definitions
[environments]
default = { features = ["prod"], solve-group = "default" }
test = { features = ["prod", "test"], solve-group = "default" }
bench = { features = ["prod", "bench"], solve-group = "default" }
sphere-bench = { features = ["prod", "bench", "sphere-bench"], solve-group = "default" }
# Optional s2fft peer. JAX is not locked here; run `pixi run sht-bench-bootstrap`.
sht-bench = { features = ["prod", "test", "sphere-bench"], solve-group = "default" }
cuda-bench = { features = ["cuda"], no-default-feature = true, solve-group = "cuda" }
smacs-cuda = { features = ["cuda", "smacs"], no-default-feature = true, solve-group = "smacs-cuda" }
smacs = { features = ["prod", "test", "smacs"], solve-group = "smacs" }
svo-bootstrap = { features = ["prod", "svo-bootstrap"], solve-group = "default" }
bench-all = { features = ["prod", "bench", "sphere-bench"], solve-group = "default" }
map-compat = { features = ["prod", "bench", "sphere-bench", "map-compat"], solve-group = "map-compat" }
map-compat-cuda = { features = ["cuda", "map-compat"], no-default-feature = true, solve-group = "map-compat-cuda" }
bench-legacy = { features = ["bench-legacy"], solve-group = "bench-legacy" }
astrometry = { features = ["prod", "astrometry"], solve-group = "default" }
phase0-wcs = { features = ["phase0-wcs"], no-default-feature = true, solve-group = "phase0-wcs" }
