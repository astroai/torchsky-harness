sphere-bench-geometry-gate = "pixi run -e sphere-bench python -m torchsky_harness.cli run bench_sphere_matrix -- --device cpu --nside 1024 --n-points 200000 --runs 5 --strict-missing --output-dir benchmark_results/sphere_matrix_latest --min-median-ratio-vs-healpy ang2pix_ring=1.8,ang2pix_nested=1.35,pix2ang_ring=1.15,pix2ang_nested=1.0,ring2nest=1.05,nest2ring=0.85"
