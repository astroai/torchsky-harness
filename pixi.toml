sphere-bench-healpix-advanced = "pixi run -e sphere-bench python -m torchsky_harness.cli run bench_healpix_advanced -- --device cpu --nside 1024 --n-points 200000 --runs 5 --json-out benchmark_results/healpix_advanced.json"
