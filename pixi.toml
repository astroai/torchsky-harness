[feature.prod]
platforms = ["osx-arm64", "linux-64"]

[feature.prod.dependencies]
python = "==3.13.14"

[feature.prod.pypi-dependencies]
torchfits = "==1.0.0"
canfar = "*"
vos = "*"

# Test feature with comparison libraries
[feature.test.dependencies]
astropy = ">=5.0"
pandas = ">=2.2"
polars = ">=1.0"
pyarrow = ">=14.0"
pyright = ">=1.1.350"
pytest-xdist = ">=3.0"
