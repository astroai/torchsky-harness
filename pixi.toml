phase0-astrometry-net = { features = ["phase0-astrometry-net"], no-default-feature = true, solve-group = "phase0-astrometry-net" }
phase0-astrometry-portable = { features = ["phase0-astrometry-portable"], no-default-feature = true, solve-group = "phase0-astrometry-portable" }
